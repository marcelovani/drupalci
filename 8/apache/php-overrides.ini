log_errors = on
; Off prevents deprecation/warning HTML from contaminating functional test HTTP responses.
display_errors = off
memory_limit = 1024M
error_level = E_NOTICE
; E_DEPRECATED is excluded to quiet PHP-engine deprecation noise (e.g. Drush/
; Consolidation/Robo "implicitly nullable parameter" notices on newer PHP
; versions) now that watchdog/syslog output is forwarded to `docker logs`.
; log_errors above stays on, so this only trims one category, not logging
; overall. To bring deprecation noise back, change this to plain `E_ALL`; to
; also silence userland deprecations (trigger_error(..., E_USER_DEPRECATED)),
; change to `E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED`.
error_reporting = E_ALL & ~E_DEPRECATED
; Disable assertions to suppress assert.active deprecation in PHP 8.5+
zend.assertions = -1

[opcache]
opcache.enable=1
; 0 means it will check on every request
; 0 is irrelevant if opcache.validate_timestamps=0 which is desirable in production
opcache.revalidate_freq=0
opcache.validate_timestamps=1
opcache.max_accelerated_files=10000
opcache.memory_consumption=192
opcache.max_wasted_percentage=10
opcache.interned_strings_buffer=16
opcache.fast_shutdown=1
